; supervisord.conf — Squire tenant runtime process table.
;
; Runs as the unprivileged `hermes` user, launched by bin/squire-entrypoint.sh,
; which is itself the container's main program under upstream's s6 PID 1. So the
; supervision tree is:
;
;   /init (s6, PID 1)            zombie reaping + volume bootstrap
;    └─ squire-entrypoint.sh     secrets, template seeding
;        └─ supervisord          this file
;            ├─ hindsight        memory daemon -> starts pg0 (PostgreSQL 18)
;            ├─ webhook          $PORT listener / ingress entry point
;            ├─ secrets-sync     re-seals credentials onto the volume
;            ├─ gateway          hermes-agent
;            ├─ hindsight-healthcheck
;            ├─ heartbeat        counts-only telemetry -> control-api
;            └─ backup           nightly restic snapshot -> B2
;
; Start order is by ascending priority; STOP order is the reverse. The one
; ordering that carries real consequence is secrets-sync (25) vs gateway (30):
; the sealer must outlive the gateway's drain or last-moment credential writes
; are lost. See that program's block for the full story.
;
; SHUTDOWN BUDGET — worst case is a SUM, not a max.
; supervisord stops programs sequentially in descending priority, waiting up to
; each one's stopwaitsecs before escalating to SIGKILL. So the worst-case total
; is the sum of every stopwaitsecs, not the largest:
;
;     backup                (70)  10s
;     heartbeat             (60)  10s
;     hindsight-healthcheck (50)  10s
;     gateway               (30)  60s   <- graceful turn drain
;     secrets-sync          (25)  20s   <- final credential re-seal
;     webhook               (20)  10s
;     hindsight             (10)  45s   <- PostgreSQL checkpoint
;     ------------------------------------
;     worst case                 165s
;
; If Railway's termination grace period is shorter than that, the container is
; SIGKILLed mid-shutdown and we lose exactly what these timeouts protect: an
; in-flight turn, a just-written credential, or a clean Postgres checkpoint.
;
; VERIFY ON FIRST LIVE DEPLOY (cannot be checked without the platform): confirm
; Railway's grace period exceeds 165s, or trim the two big waits. In practice
; every stop is far quicker than its ceiling — these are ceilings, not
; durations — but the budget must be sized for the bad day, not the good one.
;
; Everything logs to stdout/stderr (redirect_stderr + /dev/fd/1) so `railway
; logs` is the single place to look. Nothing writes a logfile to the volume:
; the volume is precious, size-limited, and backed up.

[supervisord]
nodaemon=true
; /opt/squire/run is created and chowned to hermes at build time. Keeping
; supervisord's own state off the volume means a corrupt pid/socket can never
; survive a redeploy.
pidfile=/opt/squire/run/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
; We are ALREADY the unprivileged `hermes` user by this point (upstream's
; main-wrapper.sh drops privileges before exec'ing our entrypoint), so this is
; not a privilege drop — supervisord cannot raise privileges it does not have.
; It is an assertion: if a future change ever caused this to run as root,
; supervisord would switch to `hermes` rather than silently running the
; gateway, pg0 and initdb as root (pg0's initdb refuses root outright).
user=hermes

[unix_http_server]
file=/opt/squire/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///opt/squire/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ---------------------------------------------------------------------------
; hindsight — long-term memory daemon + embedded PostgreSQL
; ---------------------------------------------------------------------------
; hindsight-api starts and owns pg0 (bundled PostgreSQL 18) itself, driven by
; HINDSIGHT_API_DATABASE_URL=pg0://hindsight:5432 from the Dockerfile. We do not
; supervise pg0 as a separate program: pg0's CLI is a start/stop manager, not a
; foreground server, so wrapping it here would give supervisord a process that
; exits immediately while the real postmaster lives on — the exact "supervisor
; watching a stub" failure we avoid for the gateway below.
;
; Started first (priority 10) because the gateway's memory provider expects the
; daemon at 127.0.0.1:9177. The gateway degrades gracefully if it is not up yet,
; so this is an ordering preference, not a hard dependency.
;
; Runs through squire-hindsight-run.sh rather than the binary directly. That
; wrapper re-sources the LLM credentials on every (re)start, which is what makes
; `supervisorctl restart hindsight` actually re-configure the daemon after a
; tenant connects their own provider — supervisord would otherwise hand it the
; same frozen environment supervisord itself was started with.
;
; startsecs=60: first boot has to initdb, run alembic migrations and load the
; local embedding model. Anything shorter and supervisord declares a cold start
; a crash loop.
[program:hindsight]
command=/opt/squire/bin/squire-hindsight-run.sh
priority=10
autostart=true
autorestart=true
startsecs=60
startretries=5
stopsignal=TERM
; Generous stop wait: killing PostgreSQL mid-checkpoint is how you get a
; corrupt memory database on a Railway redeploy.
stopwaitsecs=45
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------------------------------------------------------------------------
; webhook — the container's public face
; ---------------------------------------------------------------------------
; Second (priority 20) and independent of the gateway on purpose: it must be
; answering /health and returning a retryable 503 on /webhook/telegram while the
; gateway is still coming up, so a cold start looks like latency rather than a
; dead tenant.
[program:webhook]
command=/opt/squire/venv/bin/python /opt/squire/bin/squire-webhook-shim.py
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------------------------------------------------------------------------
; gateway — hermes-agent
; ---------------------------------------------------------------------------
; --no-supervise is load-bearing, not defensive noise. Inside an s6 container
; `hermes gateway run` normally redirects itself into s6 supervision and leaves
; the invoking process as a heartbeat stub (hermes_cli/gateway.py::
; _maybe_redirect_run_to_s6_supervision). supervisord would then be watching the
; stub while the real gateway ran outside its control. The Dockerfile also sets
; HERMES_GATEWAY_NO_SUPERVISE=1; both are kept so removing either one alone
; cannot silently reintroduce the bug.
;
; Absolute path to the venv binary rather than bare `hermes`: PATH puts
; /opt/hermes/bin (the docker-exec privilege-drop shim) first, and we are
; already the right user.
[program:gateway]
command=/opt/hermes/.venv/bin/hermes gateway run --no-supervise
directory=/opt/data
priority=30
autostart=true
autorestart=true
startsecs=45
startretries=10
; The gateway handles SIGTERM as a graceful drain (finish the in-flight turn,
; flush the delivery ledger). Give it room — an amputated turn shows up to the
; user as the agent going silent mid-sentence.
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------------------------------------------------------------------------
; secrets-sync — tmpfs -> volume, encrypted
; ---------------------------------------------------------------------------
; priority=25 is deliberate and sits BELOW the gateway's 30.
;
; supervisord starts in ascending priority and stops in DESCENDING priority, so
; a lower number means "first to start, last to stop". At the old priority=40
; this program was stopped FIRST — before the gateway's 60-second graceful
; drain — so any credential the agent wrote while finishing its last turn (an
; OAuth refresh, a key the user pasted seconds before the redeploy) was written
; to tmpfs with nothing left running to seal it, and vanished.
;
; Now it outlives the gateway and its SIGTERM handler performs the final
; re-seal after the gateway has finished draining.
[program:secrets-sync]
command=/opt/squire/bin/squire-secrets-sync.sh
priority=25
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
; Long enough for the SIGTERM handler's final re-seal pass to finish. A
; credential written just before a redeploy must not be lost.
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------------------------------------------------------------------------
; hindsight-healthcheck — guide §4 wedge recovery
; ---------------------------------------------------------------------------
[program:hindsight-healthcheck]
command=/opt/squire/venv/bin/python /opt/squire/bin/squire-hindsight-healthcheck.py
priority=50
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------------------------------------------------------------------------
; heartbeat — counts-only fleet telemetry (Task 0.6)
; ---------------------------------------------------------------------------
; Posts counters/gauges to control-api every SQUIRE_HEARTBEAT_INTERVAL seconds.
; Started last (priority 60) and stopped first: it is pure observability, so a
; shutdown should spend its budget on draining turns and sealing credentials,
; not on one more beat. Losing the final beat costs nothing — control-api
; treats silence as "stale", which is exactly what a stopping container is.
;
; autorestart=unexpected + exitcodes=0, not autorestart=true: with no
; CONTROL_API_URL (a bare `docker run`) the emitter exits 0 on purpose, and
; supervisord must leave it EXITED rather than crash-looping a program that has
; correctly decided it has nothing to do.
;
; startsecs=0 goes with that, and is not a detail. With any non-zero startsecs,
; a program that exits inside the window is treated as a FAILED START —
; supervisord retries it, then marks it FATAL and logs "exited too quickly".
; The intentional no-op path would look exactly like a broken program.
[program:heartbeat]
command=/opt/squire/venv/bin/python /opt/squire/bin/squire-heartbeat.py
priority=60
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------------------------------------------------------------------------
; backup — nightly restic snapshot of the volume to B2 (Task 0.6)
; ---------------------------------------------------------------------------
; This is the SCHEDULER, not a one-shot: the script sleeps until the nightly
; window (plus jitter) and backs up in a loop. The implementation plan says
; "Railway cron", which does not exist as a mechanism for running a command
; inside an already-running service — a cron-scheduled service would be a
; different container without this tenant's volume or DEK. See the header of
; bin/squire-backup.sh for the full explanation of the deviation.
;
; Same autorestart=unexpected + startsecs=0 reasoning as the heartbeat, and it
; matters more here: with no B2 account configured (the state today) the script
; exits 0 within milliseconds on EVERY tenant, so a non-zero startsecs would put
; this program into FATAL on every container in the fleet.
;
; Priority 70 (last to start, first to stop) and a short stop wait: an
; interrupted restic run is safe — restic snapshots are atomic, so a killed
; backup leaves the repository consistent and tomorrow's run picks up where it
; left off via its own de-duplication.
[program:backup]
command=/opt/squire/bin/squire-backup.sh
priority=70
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
