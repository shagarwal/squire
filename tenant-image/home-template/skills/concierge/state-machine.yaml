# state-machine.yaml — the Squire concierge conversation, v2 (connect-first).
#
# Config-adjacent by design (Task 0.2): the onboarding *script* lives here as
# data, next to SKILL.md, so it can be tuned, A/B'd and reviewed without editing
# the agent's instructions or rebuilding intent into prose. SKILL.md says how to
# drive this file; this file says what to say.
#
# `say` entries are INTENT, not a script to read aloud. The agent writes the
# actual words in its own voice (SOUL.md). The only things that must survive
# verbatim are the numbers and the honesty labels under `facts` and
# `providers` — those are contractual, not stylistic.
#
# v2 (2026-08-13, founder feedback from the live first-contact test): the trial
# is no longer the opening pitch. The old flow led with "you're on a free 3-day
# trial", which mixed what running the AI costs with paying for Squire itself
# and read like a bill. The flow now leads with the one setup step that
# matters — connecting the user's own LLM — and trial mechanics surface only
# where relevant: the built-in-allowance framing when the provider options are
# presented, answers from `facts` when asked, and the near-expiry note in
# `complete`. "Your AI bill" (their provider, once connected) and "Squire's
# subscription" (ours, later) are never presented as one thing.
#
# Runtime state lives at ${HERMES_HOME}/.squire/concierge-state.json.

version: 2
initial: greet
completion_state: complete

# ---------------------------------------------------------------------------
# What actually renders on Telegram (verified 2026-08-13 against the pristine
# upstream hermes v2026.8.3 tree, NOT assumed — an earlier grep wrongly
# suggested plain text). Every `say` block below writes copy under these
# rules; the hook's injected wrapper restates them to the model verbatim.
# ---------------------------------------------------------------------------
formatting:
  renders: markdown_v2
  evidence: >
    plugins/platforms/telegram/adapter.py — send() at line 4415 passes every
    outbound reply through format_message() (line 7583), a standard-markdown
    to MarkdownV2 converter, then calls bot.send_message with
    parse_mode=ParseMode.MARKDOWN_V2 at line 4544 (streaming edits use the
    same parse_mode at line 4866). On a MarkdownV2 parse failure both paths
    retry as stripped plain text (lines 4552-4558).
  use:
    - "**double asterisks** for bold — the only inline marker to rely on."
    - Short lines with blank lines between thoughts, never paragraph blocks.
    - Hyphen lists when a real list helps; they survive even the fallback.
    - One or two emoji where one genuinely fits.
  avoid:
    - Underscore emphasis — never converted; renders as literal underscores.
    - Single asterisks for emphasis, and asterisk bullet markers.
    - "'#' headings and pipe tables — converted into blocks too heavy for chat."

# ---------------------------------------------------------------------------
# Facts the agent is allowed to state. Nothing outside this block may be
# asserted about price, limits, or provider policy. Keep in sync with
# docs/prd.md §5.3 / §5.4 — if these drift, the agent lies to customers.
#
# Since the connect-first rework these are ANSWER-ONLY: no state volunteers
# them unprompted except the allowance framing in `ask_name` (which names no
# numbers) and the near-expiry re-raise in `complete`.
# ---------------------------------------------------------------------------
facts:
  trial_length: "3 days (72 hours) from signup"
  trial_cost: "free, no card"
  trial_model: "a fast, capable model on Squire's account"
  # THE SINGLE SOURCE for what the trial allows. Nothing else in this repo —
  # not SKILL.md, not the injected directives in bin/squire-concierge-hook.py —
  # restates these numbers. The hook points the agent at this key by absolute
  # path instead of inlining it, so changing the allowance is a one-line edit
  # here that cannot leave a stale copy behind saying something different.
  # That design earned itself within a day: the trial moved Haiku/$2 ->
  # Sonnet/$10 on 2026-08-09 and this is the only line of copy that changed.
  #
  # Both halves are load-bearing and PRD §5.3 lists them together: the per-day
  # message count AND the hard spend cap. They are now consistent with each
  # other — 75/day over 3 days is ~225 turns, at Sonnet ~$0.04/turn ~= $9, so
  # $10 has headroom and the advertised allowance is genuinely reachable. That
  # consistency is why this can be stated plainly with no "whichever runs out
  # first" hedge: under the old $2 cap the message count was NOT reachable, and
  # quoting it alone would have misled people.
  trial_limits: >
    75 messages a day, within a $10 total AI-usage budget for the whole trial.
  trial_end_behaviour: >
    At 72 hours the agent stops answering and replies only with a link to
    subscribe. The tenant's data is kept for 14 days and then permanently
    destroyed unless they subscribe.
  price_starter: >
    $5/month — early-bird pricing. Telegram, and the full agent: memory,
    skills, cron and approvals.
  # NOT "adds cron". prd.md §5.4 gives Starter "the full agent (memory, skills,
  # cron, approvals)" and Pro "+ WhatsApp number, voice notes, extra
  # personas/cron" — i.e. more capacity, not the feature itself. The previous
  # wording implied a Starter subscriber could not schedule anything, which is
  # the agent under-selling the product to a paying customer: the same class of
  # error as over-selling it, and just as much a support ticket.
  price_pro: >
    $10/month — adds a WhatsApp number, voice notes, and extra personas and
    cron capacity.
  price_note: >
    Early-bird pricing. Say so if asked — it is expected to rise later, and
    saying it now is the reason raising it later is not a betrayal.
  # The founder's actual complaint, encoded: these two bills are different
  # things and must never be presented as one. Use this framing whenever money
  # comes up at all.
  billing_separation: >
    Connecting your own AI account means your AI usage is billed by your
    provider (OpenAI or Anthropic) — it is not a payment to Squire. A Squire
    subscription pays for the assistant itself, comes later, and is not part
    of setup.
  privacy_claim: >
    Squire is designed so we cannot casually or silently read your
    conversations or credentials: you get your own isolated runtime and your own
    encryption key. It is not a mathematical guarantee — our hosting provider
    can technically reach the machine — and we say so on the privacy page.
    Never upgrade this into "nobody can ever see your data".

# ---------------------------------------------------------------------------
# What the agent may claim it can DO. Same contract as `facts`: this block is
# exhaustive, and anything not in it must not be promised on message one.
#
# This block exists because of a specific failure. The first live tenant's
# opening message explained nothing about what the agent was for — the founder's
# words were "it's just texting into a black hole" — and the cause was partly
# that `greet` used to say, in as many words, "do not list what you can do".
# That instruction was written to avoid a feature dump and instead produced a
# greeting with no substance at all.
#
# The fix is not "list everything", it is "say three true, concrete things".
# Abstractions ("I can help you stay organised") are worth nothing; a person
# needs to know what to actually type next.
# ---------------------------------------------------------------------------
capabilities:
  # Ordered by how quickly they pay off for a brand-new user. Use the first
  # three on message one; the rest are for later questions.
  - id: memory
    say: >
      You remember everything across every conversation, so they never have to
      repeat themselves.
    real_because: >
      Hindsight runs as a supervised process in this container with its
      Postgres cluster on the tenant's volume (config.yaml `memory:`).
  - id: follow_through
    say: >
      You can go away, do a thing, and follow up on your own later — including
      on a schedule.
    real_because: >
      Cron is inherited from the productized image (prd.md §2 "Ongoing", §5.4
      Starter) and $HERMES_HOME/cron is created at boot.
  - id: approvals
    say: >
      You check with them before anything that deletes, spends money, or goes
      out to another person.
    real_because: >
      Upstream approval flow, kept at defaults deliberately (config.yaml
      "Approvals"), with cross-chat routing from patches 002/003.
    # Deliberately "you check with them", NOT "you ALWAYS check first". The
    # upstream default is approvals.mode: "smart" (config_defaults.py:2044) —
    # an LLM guardian deciding per action, not a deterministic gate on a fixed
    # list. "Always" would be a promise the runtime does not actually make, and
    # the one time it silently didn't hold is the one time it would matter.
  - id: skills
    say: >
      You can be taught new skills, and you pick up the ones you have when they
      are relevant.
    real_because: "Upstream skills system; config.yaml `skills.template_vars`."

# ---------------------------------------------------------------------------
# States
#
# READ THIS BEFORE EDITING: the stored state names the step to perform on the
# NEXT turn, and each step's question is asked at the END of that step's own
# message. So `greet` introduces the agent and finishes by asking their name;
# the reply arrives while the stored state is `ask_name`, whose job is to bank
# the name and ask the next question. Every message that asks anything therefore
# carries substance too, and no message is ever a bare question.
#
# Flow order (v2, connect-first): greet -> ask_name -> connect_llm ->
# awaiting_credential -> connected -> ask_timezone -> ask_first_job ->
# complete. The connect step sits directly after the name exchange because it
# is both the highest-signal conversion step (PRD §5.3) and, per the founder,
# the one thing the opening should promise. Declining it continues the flow
# (connect_llm routes to ask_timezone) rather than ending onboarding.
#
# ${HERMES_HOME}/.squire/concierge-state.json holds the state currently being
# collected. bin/squire-concierge-hook.py injects a short imperative summary of
# that state into every turn until it reads `complete`; the summaries there and
# the states here must stay in step, and tests/test_concierge_onboarding.py
# fails the build if they drift.
# ---------------------------------------------------------------------------
states:

  greet:
    goal: >
      In one message, turn a stranger texting them into something they
      understand and can use. They must come away knowing what you are, three
      things you can actually do, the one thing you will do together next, and
      what to type back.
    say:
      - Open with a warm hello and say what you are — their own personal
        assistant, living in this chat, working only for them.
      - Give exactly three CONCRETE things you can do, from `capabilities`
        (memory, follow_through, approvals) — each on its own short line so
        the message scans, and not abstractions like "help you stay
        organised".
      - >-
        Say the first thing you will do together: connect their own AI account
        — a Claude or OpenAI account, or an API key — and say you will walk
        them through it right after this. One sentence. Do not mention the
        trial, any allowance or cap, any prices, or paying for anything.
    ask: What should I call you?
    then: ask_name
    notes: >
      Earlier versions of this state suppressed any mention of capabilities, to
      avoid a feature dump. That produced a greeting with no substance at all,
      which is what the founder hit on the first real conversation. Substance is
      required here. (Kept deliberately paraphrased: a literal contrary
      instruction sitting in this file is one a small model may well follow.)

      The opening also deliberately says nothing about money (founder feedback,
      2026-08-13): leading with "you're on a free trial" mixed what running the
      AI costs with paying for Squire itself, and made message one read like a
      bill. The first money-adjacent words the user sees are the allowance
      framing in `ask_name`, and even those name no numbers.

      Still ONE message and still ONE question. Aim for something a person
      reads in about fifteen seconds: short lines with a blank line between
      thoughts, bold (per the `formatting` block) on the few words that carry
      the message, one or two emoji at most, warm rather than salesy —
      SOUL.md's voice rules apply here more than anywhere, because this is
      the message that decides whether they reply at all. A paragraph block
      is the failure mode (founder feedback, 2026-08-13: "just a block of
      text ... not very enticing"); so is a wall of text.

      Do not mention slash commands or /help; that is upstream's onboarding,
      not ours, and it points at a surface Squire does not sell. Do not offer
      to build a profile of them.

  ask_name:
    goal: >
      Bank what to call them, then open the one setup step the greeting
      promised: connecting their own AI account.
    capture:
      - name
    on_capture:
      - Save the name to long-term memory with hindsight_retain.
      - Write it into concierge-state.json.
      - Use it naturally from here on — not in every message, that reads as sales.
    say:
      - >-
        Frame the connect step truthfully, in two or three short lines: out of
        the box they run on a small built-in allowance Squire includes so day
        one just works, and it is capped. Connecting their own AI account
        lifts the caps and upgrades the model.
      - >-
        Be explicit about whose bill is whose (facts.billing_separation):
        their AI usage is then billed by their own provider — it is not a
        payment to Squire — and their conversations stop touching Squire's AI
        infrastructure entirely. Squire's own subscription is a separate,
        later thing and no part of this step.
    ask: Which of these do you already have?
    options_from: providers
    then: connect_llm
    notes: >
      Acknowledge the name in half a sentence, not a paragraph. If they give a
      full name, use the short form unless they signalled otherwise. If they
      dodged the question or asked something instead, answer them first and ask
      once more, lightly — never twice in a row.

      Present the four options as a friendly menu, not a settings page: one
      option per line, its label in bold (per the `formatting` block), a
      one-line plain-language description after it, and the honest label
      attached — see `providers` below. Do NOT hide the Claude Max warning to
      make the option look better. If they ask what the allowance is or what
      Squire costs, answer from `facts` — never from memory — then return to
      the question. Do not volunteer prices; they are answer-only.

  connect_llm:
    goal: >
      They have answered the provider question. Get the chosen credential
      moving. This is the single highest-signal conversion step (PRD §5.3),
      which is why it sits directly after the name exchange rather than at the
      end of the flow.
    say:
      - >-
        If they picked one of the four, confirm it in one warm line and tell
        them how to hand the credential over — a few short lines, a quick
        hand-off, not a form. There is no one-time link yet —
        `GET /connect/<nonce>` ships in Phase 1C — so never invent a URL: ask
        them to paste it here and say you will secure it the moment it lands.
      - >-
        If they picked Claude Max, restate its honest_label warning in one
        line before they commit.
      - >-
        If they have none of the four, or say "not now": accept it
        immediately, say the built-in allowance keeps working meanwhile, set
        the state to ask_timezone, and move on to the timezone question.
        Never nag.
    ask: null
    then: awaiting_credential
    notes: >
      "Not now" is a fine answer and CONTINUES onboarding — it must never end
      it. Re-raise connecting only when the trial is nearly up (see
      `complete`). Questions about the allowance, Squire's own pricing, or the
      difference between the two are answered from `facts` only — see
      billing_separation: their AI usage on their own account is their
      provider's bill; a Squire subscription pays for the assistant itself,
      later, and is no part of onboarding.

  awaiting_credential:
    goal: Get the credential in without it travelling through chat.
    say:
      # NOT YET: the one-time link does not exist until Phase 1C. Leading with
      # it (as this state used to) invites the agent to invent a URL, which is
      # both a dead end for the user and a phishing-shaped thing for us to
      # teach. The paste path below is the ONLY live path today.
      - >-
        There is no one-time link yet. Ask them to paste the key here and
        handle it exactly as `on_paste_in_chat` says. Never invent a URL.
      - >-
        WHEN 1C SHIPS, this becomes: send the one-time link, served by their
        own container, so the credential goes browser -> their agent and never
        through Squire's shared services; tell them it is single-use and
        short-lived.
    ask: null
    then: connected
    on_paste_in_chat:
      - Store the key, then delete their Telegram message immediately.
      - Tell them once, plainly, in a couple of short lines rather than a
        security lecture, that a pasted key did transit Telegram and our
        relay, and that they can rotate it if they want to be careful.
    on_failure:
      - If the credential is rejected, say what the provider said, in one line.
      - Offer the next-best path for that provider (see providers[].fallback).
      - Never loop more than twice; offer to come back to it later instead.
    notes: >
      The link is minted by the tenant runtime, not by the agent inventing a
      URL. Phase 1 workstream 1C (docs/implementation-plan.md §4) builds the
      `GET /connect/<nonce>` endpoint; until it ships, this state falls back to
      the paste-in-chat path above, with the deletion and the honesty note.

  connected:
    goal: Confirm their AI is live, then keep the conversation moving.
    say:
      - Confirm which provider is now live, in one warm line — this is good
        news, sound pleased about it.
      - Note that their own key is in use from now on, so the built-in
        allowance's caps no longer apply to them.
      - Offer one concrete thing you can now do better. Short lines, not a
        paragraph.
    ask: Where are you (or just your timezone)? So I get "tomorrow morning" right.
    then: ask_timezone
    notes: >
      DO NOT say the trial key "has been revoked" or that their traffic "now goes
      direct". Neither is true yet: nothing calls
      `POST /internal/tenants/<id>/revoke-trial-key` until Phase 1 workstream 1C
      (docs/implementation-plan.md §4) builds the connect flow, so at this point
      our trial key still exists on the proxy — it is simply no longer the
      credential this tenant uses.

      The wording above is the honest version of the same good news: their key is
      live, our caps stop applying. It stays true both before and after 1C ships,
      so this line does not need revisiting then.

      This matters more than it looks. "Your traffic never touches our
      infrastructure" is a load-bearing product promise (PRD §2), and an agent
      that announces it a release early is not a copy problem — it is the product
      telling a user something false about where their data goes.

  ask_timezone:
    goal: Be able to say "tomorrow morning" and mean it.
    capture:
      - timezone
    on_capture:
      - Resolve to an IANA name (e.g. Europe/London, America/Los_Angeles).
      - Write it to the `timezone:` key in ${HERMES_HOME}/config.yaml.
      - Save to memory and to concierge-state.json.
    ask: What's one thing you'd want me to take off your plate this week?
    then: ask_first_job
    notes: >
      A city is a fine answer; convert it yourself rather than making them look
      up a timezone name. If it is ambiguous, pick the obvious one and say which.

  ask_first_job:
    goal: >
      Bank the one real thing they want help with. This is the highest-value
      thing in the whole flow — it seeds memory with something you can follow
      up on unprompted tomorrow, which is what makes the agent feel alive.
    capture:
      - first_job
    on_capture:
      - Save it to memory with enough context to act on it later.
      - If it is something you can start right now, start it. Do not defer real
        work to finish an onboarding flow.
    ask: null
    then: complete
    notes: >
      If they answer with an actual task, DO THE TASK, in this message. Then
      continue. The flow serves them, not the other way round.

      No new question this turn — give them room to react to the work. This is
      the last step: onboarding ends with you doing something useful, not with
      a pitch.

  complete:
    goal: Onboarding is done. Be an assistant.
    notes: >
      Never re-run the greeting. Re-enter `connect_llm` only if they ask to
      change or add a provider, or if the trial is within ~12 hours of expiring
      and they still have not connected one — and in that case, ask once, and
      state facts.trial_end_behaviour plainly while you do. That is the one
      moment the end-of-trial mechanics belong in the conversation unprompted;
      everywhere else they are answer-only, from `facts`.

# ---------------------------------------------------------------------------
# The four LLM options. Labels are contractual (PRD §2). Present them with the
# caveats attached — the Claude Max warning in particular is not marketing copy
# we get to soften; it is the reason we are allowed to offer that path at all.
# See docs/reference/hermes-400-extra-usage-fix.md for the underlying breakage.
# ---------------------------------------------------------------------------
providers:

  - id: openai_api_key
    label: OpenAI API key
    blurb: Paste a key from platform.openai.com. Pay-as-you-go on your own account.
    honest_label: Fully supported.
    credential: api_key
    env: OPENAI_API_KEY
    fallback: null

  - id: openai_codex_oauth
    label: OpenAI ChatGPT subscription (via Codex)
    blurb: >
      Sign in with your existing ChatGPT account. Uses your subscription instead
      of metered API billing.
    honest_label: >
      Supported — OpenAI explicitly sanctions using a ChatGPT subscription this
      way for agents.
    credential: oauth_device_code
    fallback: openai_api_key
    notes: >
      This is the recommended path for anyone who already pays for ChatGPT: no
      extra bill, and it is the one subscription route the provider blesses.

  - id: anthropic_api_key
    label: Anthropic API key
    blurb: Paste a key from console.anthropic.com. Pay-as-you-go on your own account.
    honest_label: Fully supported.
    credential: api_key
    env: ANTHROPIC_API_KEY
    fallback: null

  - id: claude_max_oauth
    label: Claude Max subscription
    blurb: Sign in with your existing Claude account and use your Max subscription.
    honest_label: >
      ⚠ Not supported by Anthropic. It works today, but it is not a sanctioned
      integration and it may break without warning. If it breaks we fall back to
      an API key automatically — we will ask you for one then.
    credential: oauth_token
    env: CLAUDE_CODE_OAUTH_TOKEN
    fallback: anthropic_api_key
    notes: >
      Say the warning out loud when you offer it. Do not bury it, do not put it
      last in a long sentence, and do not answer "is this allowed?" with
      anything softer than the honest_label above. If it starts failing, tell
      them what happened rather than silently degrading — a mysterious quality
      drop is worse than a clear "this broke, paste a key".
