# config.yaml — baked Squire tenant configuration for hermes-agent.
#
# Seeded onto the volume on FIRST BOOT ONLY (see bin/squire-entrypoint.sh); after
# that the tenant's copy is authoritative and image upgrades leave it alone.
# Hermes also rewrites this file in place when a config migration runs, so treat
# it as a starting point, not a source of truth for a running tenant.
#
# Only keys where Squire deliberately differs from upstream's defaults are set.
# Everything omitted inherits hermes_cli/config_defaults.py, which keeps this
# file readable and keeps upgrades from silently freezing an old default.
#
# Credentials NEVER live here. They live in .env / auth.json, which are symlinks
# into tmpfs and are DEK-encrypted at rest on the volume.

# --- Model -----------------------------------------------------------------
# Trial default is Sonnet-class, on our metered key against a ~$10 hard budget
# (PRD §5.3). Raised from Haiku/$2 on 2026-08-09 for two reasons that turned
# out to be the same reason: the first live tenant showed a Haiku-class model
# ignoring the concierge script outright, and onboarding and everyday
# usefulness are both instruction-following. $2 at Sonnet prices buys ~50
# turns, well under the advertised 75/day, so the cap was resized to the
# promise rather than the promise to the cap.
#
# This string is sent VERBATIM as the request's `model` field — hermes does not
# strip the provider prefix — so it must appear exactly in the trial proxy's
# model_list. apps/trial-proxy/tests/test_config.py asserts both ends of that
# contract; a mismatch 400s every trial message and looks to the user like an
# agent that never worked at all.
#
# The concierge's whole job is to get the tenant onto their own provider, at
# which point `hermes model <provider:model>` (or the connect flow) rewrites
# this. Provider credentials and ANTHROPIC_BASE_URL (the trial proxy) come from
# the environment, set per tenant by control-api.
model: "anthropic:claude-sonnet-5"

# Fallback ladder. Empty by default: during the trial there is only one key, and
# a silent fallback to a different provider would quietly bypass the metering
# proxy. The connect-your-LLM flow populates this when a tenant chooses the
# Claude Max OAuth path (PRD §6 risk 2 — "unsupported, may break, auto-fallback
# to API key"), which is precisely the case where a ladder earns its keep.
fallback_providers: []

# --- Long-term memory ------------------------------------------------------
# Hindsight is what makes the agent feel like it knows you. It runs as a
# separate supervised process in this same container and is reached over
# loopback; connection details live in hindsight/config.json.
memory:
  provider: "hindsight"
  memory_enabled: true
  user_profile_enabled: true
  # No approval gate on memory writes: an assistant that asks permission before
  # remembering your timezone is not the product.
  write_approval: false

# --- Agent behaviour -------------------------------------------------------
agent:
  # Upstream default is 500. A messaging agent that burns 500 turns on one
  # request is not thinking, it is stuck — and on the trial key it is also
  # expensive. Cap it well below the point where the user has given up.
  max_turns: 120
  # 30 min of *inactivity* (upstream default) is far too long to leave someone
  # staring at a chat. 10 minutes is still generous for a long tool loop.
  gateway_timeout: 600

# --- Telegram --------------------------------------------------------------
# The bot token, webhook URL, secret and allowlist all arrive as environment
# variables from control-api; gateway/config.py enables the platform as soon as
# TELEGRAM_BOT_TOKEN is present, so nothing here needs to turn it on.
telegram:
  # Emoji reactions on every inbound message were turned OFF after founder
  # feedback on the first live conversation (2026-08-09): reacting to each
  # message reads as noise in a 1:1 personal chat, not as liveness. Telegram's
  # native typing indicator already covers "I'm working on it", and ingress
  # sends one on wake. Do not re-enable without user-facing evidence.
  reactions: false

display:
  platforms:
    telegram:
      # Stream partial replies via message edits. This is the single biggest
      # perceived-latency win on Telegram.
      streaming: true
      # Tool-progress chatter off: "running terminal…" spam reads as noise in a
      # personal chat. The reactions above already signal "I'm working".
      tool_progress: "off"

# --- Skills ----------------------------------------------------------------
skills:
  external_dirs: []
  # Lets SKILL.md files reference their own directory via ${HERMES_SKILL_DIR} —
  # the concierge skill uses it to find its state machine file.
  template_vars: true

# --- Onboarding ------------------------------------------------------------
# Squire runs its OWN first conversation (the `concierge` skill). Upstream runs
# one too, and it was winning.
#
# On the very first message ever, gateway/run.py injects a note into the user
# message telling the agent to introduce itself in "one or two sentences max"
# and to mention /help — or, by default (`profile_build: ask`), an even stronger
# directive to offer to build a user profile. Both land in the same
# high-salience slot our concierge directive uses, and both are shorter and more
# concrete than a pointer buried in SOUL.md. On a Haiku-class trial model the
# short concrete instruction wins every time, which is exactly why the first
# live tenant got a two-line hello and no onboarding at all.
#
# `off` stops the profile-build directive. Patch 005 suppresses the remaining
# plain intro note while concierge state is not `complete`. Together they leave
# exactly one voice giving the agent instructions on message one.
onboarding:
  profile_build: "off"

# --- Hooks -----------------------------------------------------------------
# The deterministic half of onboarding. hermes runs `pre_llm_call` hooks once
# per turn and appends whatever they print to the USER message, which is the
# highest-salience position in the prompt — better than the system prompt for a
# small model, and the same channel upstream uses for its own must-deliver
# notes.
#
# squire-concierge-hook.py reads .squire/concierge-state.json and, while that
# state is not `complete`, states the current step and exactly what to do about
# it. That is the whole point: the agent is TOLD it is onboarding rather than
# being asked to notice that it should be. It goes silent the moment onboarding
# completes, so it costs nothing for the rest of a tenant's life.
#
# The hook is fail-open by construction (see its module docstring): any error
# prints nothing and exits 0, and hermes treats a failed hook as a no-op. It can
# never be the reason a message goes unanswered.
hooks:
  pre_llm_call:
    # 10s is generous for a file read; the script normally finishes in tens of
    # milliseconds. The timeout exists so a pathological filesystem stall cannot
    # hold up a user's reply.
    - command: "/opt/squire/bin/squire-concierge-hook.py"
      timeout: 10

# Shell hooks normally require an interactive consent prompt on first use, and
# the gateway has no TTY — so without an opt-in the hook above silently never
# registers, a failure that looks exactly like the bug we are fixing.
#
# That opt-in is HERMES_ACCEPT_HOOKS=1, set in the Dockerfile rather than as
# `hooks_auto_accept: true` here. This file is NOT image-managed: it is seeded
# once and thereafter owned by the tenant (0644, hermes-owned, later boots only
# top up files it lacks), hermes rewrites it during config migrations and via
# upstream's onboarding `mark_seen`, and the agent itself edits `timezone:`. An
# env var survives all of that; a config key does not.
#
# What auto-accept actually costs, stated plainly: first-use consent is skipped
# for EVERY hook in this file, not only ours; those hooks persist across
# restarts; and they execute outside the tool-approval path the user sees. It
# is not a privilege escalation — the agent already has the `terminal` tool, so
# arbitrary execution was always available — but it is a real widening of what
# runs without anyone being asked, which is why the `hooks:` block above should
# stay short and reviewed.

# --- Approvals -------------------------------------------------------------
# Left at upstream defaults deliberately. The dangerous-action approval flow is
# one of the things the PRD sells (§2 "cross-chat approvals"), and re-deriving
# its policy here would fork behaviour we want to inherit from upstream.

# --- Logging ---------------------------------------------------------------
# The gateway sees every message the user sends. Its stdout is shipped to
# Railway's log aggregator, which sits OUTSIDE the tenant's isolation boundary
# and is readable by anyone with project access — so log verbosity is a privacy
# control here, not an ops preference.
#
# Upstream's default is INFO (hermes_cli/config_defaults.py:2379). WARNING keeps
# errors and genuine operational problems visible while dropping the per-turn
# chatter. There is no environment-variable equivalent, which is why this lives
# in config rather than next to the Hindsight log settings in the Dockerfile.
#
# Raise to INFO/DEBUG only for a time-boxed, consented debugging session on a
# specific tenant, and lower it again afterwards.
logging:
  level: "WARNING"

# --- Timezone --------------------------------------------------------------
# UTC until the concierge learns the user's real timezone in the first
# conversation, at which point it writes the IANA name here.
timezone: "UTC"
