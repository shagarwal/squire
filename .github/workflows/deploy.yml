name: deploy

# Deploys the Railway-hosted app services (apps/*) — NOT tenant-image, which has
# its own workflow (tenant-image.yml) and its own release cadence (git tags).
#
# - Automatic: push to main touching a service's directory -> deploy that service
#   to the `squire-staging` Railway project, authenticated with RAILWAY_TOKEN_STAGING.
# - Manual: workflow_dispatch, choose a service -> deploy that service to the
#   `squire-prod` Railway project, authenticated with RAILWAY_TOKEN_PROD. Prod is
#   intentionally never triggered by a plain push.
#
# Required GitHub secrets (repo or "staging"/"production" environment secrets —
# not set yet as of Task 0.1; Railway project creation is being handled
# separately, add these once the projects + service tokens exist):
#   RAILWAY_TOKEN_STAGING — Railway CLI token scoped to the squire-staging project
#   RAILWAY_TOKEN_PROD    — Railway CLI token scoped to the squire-prod project
#
# NOTE (Task 0.1, Phase 0): apps/control-api, apps/ingress, apps/trial-proxy, and
# apps/web are currently empty placeholders (only a .gitkeep file — real code
# lands in later tasks: 0.3, 0.4, 0.5, and Phase 1 respectively). The deploy job
# below has a "does this service have real content yet?" guard step and skips the
# actual `railway up` when the directory is still just a placeholder, so this
# workflow does not fail/block merges to main in the meantime.

on:
  push:
    branches: [main]
    paths:
      - "apps/control-api/**"
      - "apps/ingress/**"
      - "apps/trial-proxy/**"
      - "apps/web/**"
      # Editing the deploy workflow itself must trigger it, or a change to how we
      # deploy sits unexercised until the next unrelated service change.
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy to production (squire-prod)"
        required: true
        type: choice
        options:
          - control-api
          - ingress
          - trial-proxy
          - web

# The workflow only needs to check out code; Railway auth is via RAILWAY_TOKEN_*
# secrets, not GITHUB_TOKEN, so no elevated permissions are required.
permissions:
  contents: read

env:
  # Pinned so `npm install -g` doesn't silently track npm `latest` on every run.
  # Bump this deliberately when we want a newer Railway CLI.
  # (Current as of Task 0.1 review: `npm view @railway/cli version` -> 5.33.0.)
  RAILWAY_CLI_VERSION: "5.33.0"

jobs:
  # Determines which service directories changed on this push, so the deploy
  # job below only runs for the service(s) actually touched. Not used for
  # workflow_dispatch runs — those explicitly name the service via the `service`
  # input instead.
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # NOTE: output/filter keys use underscores, not the services' hyphenated
    # directory names — GitHub Actions expression dot-notation (e.g.
    # `needs.changes.outputs.control-api`) parses `-` as subtraction, which
    # would silently break these lookups. The deploy job below reads these via
    # bracket notation (`outputs[matrix.filter_key]`), which sidesteps the
    # issue entirely, but keeping the keys underscore-named here too avoids
    # ever needing bracket notation with a literal hyphenated string.
    outputs:
      control_api: ${{ steps.filter.outputs.control_api }}
      ingress: ${{ steps.filter.outputs.ingress }}
      trial_proxy: ${{ steps.filter.outputs.trial_proxy }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            control_api:
              - 'apps/control-api/**'
            ingress:
              - 'apps/ingress/**'
            trial_proxy:
              - 'apps/trial-proxy/**'
            web:
              - 'apps/web/**'

  # One matrix job covers all four services instead of four near-identical
  # jobs. `filter_key` carries the underscore-named `changes` job output that
  # corresponds to each hyphenated `service` (Railway service name / apps/
  # directory name). `service` itself is a workflow-author-controlled literal
  # from the `include` list below (never user input), so interpolating it
  # directly into `working-directory` and the `railway up --service` command
  # is safe.
  deploy:
    needs: changes
    # !cancelled() (not always()) so a cancelled push-to-main run does not
    # still attempt a deploy — always() fires even on cancellation, which
    # would be wrong here. !cancelled() still runs despite `changes` being
    # skipped (e.g. on workflow_dispatch, where `changes` never runs), which
    # is the behavior we need.
    #
    # Per-matrix-entry gating:
    #   - push:              deploy only the service(s) whose path changed,
    #                         per the `changes` job output for this entry.
    #   - workflow_dispatch:  deploy only the single service chosen via the
    #                         `service` input.
    if: |
      !cancelled() &&
      ((github.event_name == 'push' && needs.changes.outputs[matrix.filter_key] == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.service == matrix.service))
    strategy:
      fail-fast: false # one service's deploy failure shouldn't cancel the others
      matrix:
        include:
          - service: control-api
            filter_key: control_api
          - service: ingress
            filter_key: ingress
          - service: trial-proxy
            filter_key: trial_proxy
          - service: web
            filter_key: web
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      # Placeholder guard: apps/<service>/ only has .gitkeep until its
      # implementation task lands (0.3 control-api, 0.4 ingress, 0.5
      # trial-proxy, Phase 1 web).
      - name: Check apps/${{ matrix.service }} has real content
        id: content-check
        run: |
          if [ -z "$(find "apps/${{ matrix.service }}" -type f ! -name '.gitkeep')" ]; then
            echo "has_content=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/${{ matrix.service }} is still an empty placeholder — skipping deploy."
          else
            echo "has_content=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Railway CLI
        if: steps.content-check.outputs.has_content == 'true'
        run: npm install -g "@railway/cli@${{ env.RAILWAY_CLI_VERSION }}"

      - name: railway up
        if: steps.content-check.outputs.has_content == 'true'
        working-directory: apps/${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.RAILWAY_TOKEN_PROD || secrets.RAILWAY_TOKEN_STAGING }}
        run: railway up --service ${{ matrix.service }} --ci
