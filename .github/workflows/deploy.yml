name: deploy

# Deploys the Railway-hosted app services (apps/*) — NOT tenant-image, which has
# its own workflow (tenant-image.yml) and its own release cadence (git tags).
#
# - Automatic: push to main touching a service's directory -> deploy that service
#   to the `squire-staging` Railway project, authenticated with RAILWAY_TOKEN_STAGING.
# - Manual: workflow_dispatch, choose a service -> deploy that service to the
#   `squire-prod` Railway project, authenticated with RAILWAY_TOKEN_PROD. Prod is
#   intentionally never triggered by a plain push.
#
# Required GitHub secrets (set 2026-08-08):
#   RAILWAY_TOKEN_STAGING — Railway project token scoped to squire-staging
#   RAILWAY_TOKEN_PROD    — Railway project token scoped to squire-prod
#
# DESIGN NOTE — why the matrix is built with fromJSON instead of a per-entry
# job-level `if`: the `matrix` context is NOT available in job-level `if`
# expressions (only github/needs/vars/inputs are — see GitHub's context
# availability table). An earlier revision gated each matrix entry with
# `needs.changes.outputs[matrix.filter_key]` at job level, which GitHub rejects
# at event time as an invalid workflow file (the run fails in 0s with no jobs).
# Instead, the `changes` job now emits a JSON array of services to deploy, and
# the matrix itself is constructed from that array — entries that shouldn't
# deploy simply never exist.

on:
  push:
    branches: [main]
    paths:
      - "apps/control-api/**"
      - "apps/ingress/**"
      - "apps/trial-proxy/**"
      - "apps/web/**"
      # Editing the deploy workflow itself must trigger it, or a change to how we
      # deploy sits unexercised until the next unrelated service change.
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy to production (squire-prod)"
        required: true
        type: choice
        options:
          - control-api
          - ingress
          - trial-proxy
          - web

# The workflow only needs to check out code; Railway auth is via RAILWAY_TOKEN_*
# secrets, not GITHUB_TOKEN, so no elevated permissions are required.
permissions:
  contents: read

env:
  # Pinned so `npm install -g` doesn't silently track npm `latest` on every run.
  # Bump this deliberately when we want a newer Railway CLI.
  RAILWAY_CLI_VERSION: "5.33.0"

jobs:
  # Determines which service directories changed on this push and emits them as
  # a JSON array (e.g. ["control-api","ingress"]) for the deploy matrix. Not
  # used for workflow_dispatch runs — those explicitly name the service via the
  # `service` input instead.
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      # JSON array of hyphenated service names whose paths changed. "[]" when
      # only the workflow file itself changed.
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      # Filter keys use underscores: GitHub Actions expression dot-notation
      # parses `-` as subtraction, so hyphenated output names are a trap.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            control_api:
              - 'apps/control-api/**'
            ingress:
              - 'apps/ingress/**'
            trial_proxy:
              - 'apps/trial-proxy/**'
            web:
              - 'apps/web/**'
      - name: Assemble changed-service JSON list
        id: list
        env:
          CONTROL_API: ${{ steps.filter.outputs.control_api }}
          INGRESS: ${{ steps.filter.outputs.ingress }}
          TRIAL_PROXY: ${{ steps.filter.outputs.trial_proxy }}
          WEB: ${{ steps.filter.outputs.web }}
        run: |
          s=()
          [ "$CONTROL_API" = "true" ] && s+=('"control-api"')
          [ "$INGRESS" = "true" ] && s+=('"ingress"')
          [ "$TRIAL_PROXY" = "true" ] && s+=('"trial-proxy"')
          [ "$WEB" = "true" ] && s+=('"web"')
          list="[$(IFS=,; echo "${s[*]}")]"
          echo "services=$list" >> "$GITHUB_OUTPUT"
          echo "Deploy list: $list"

  # One matrix job covers all services. `matrix.service` values come either from
  # the `changes` job's JSON list (push) or from the workflow_dispatch input —
  # both workflow-author-controlled or choice-constrained, so interpolating into
  # `working-directory` and `railway up --service` is safe.
  deploy:
    needs: changes
    # !cancelled() (not always()): a cancelled run must not still deploy, but
    # the job must run despite `changes` being skipped on workflow_dispatch.
    # The empty-list guard matters: constructing a matrix from "[]" is an error,
    # so the job is skipped outright when a push changed no service directories
    # (e.g. a push touching only this workflow file).
    if: |
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' || (needs.changes.outputs.services != '' && needs.changes.outputs.services != '[]'))
    strategy:
      fail-fast: false # one service's deploy failure shouldn't cancel the others
      matrix:
        service: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.service)) || fromJSON(needs.changes.outputs.services) }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      # Placeholder guard: apps/web only has .gitkeep until Phase 1A lands.
      - name: Check apps/${{ matrix.service }} has real content
        id: content-check
        run: |
          if [ -z "$(find "apps/${{ matrix.service }}" -type f ! -name '.gitkeep')" ]; then
            echo "has_content=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/${{ matrix.service }} is still an empty placeholder — skipping deploy."
          else
            echo "has_content=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Railway CLI
        if: steps.content-check.outputs.has_content == 'true'
        run: npm install -g "@railway/cli@${{ env.RAILWAY_CLI_VERSION }}"

      - name: railway up
        if: steps.content-check.outputs.has_content == 'true'
        working-directory: apps/${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.RAILWAY_TOKEN_PROD || secrets.RAILWAY_TOKEN_STAGING }}
        run: railway up --service ${{ matrix.service }} --ci
