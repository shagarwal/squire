[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "squire-control-api"
version = "0.1.0"
description = "Squire control plane: tenant registry, bot pool, Railway-driven provisioning state machine."
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Runtime deps are deliberately minimal: this is the "boring monolith".
# Everything is *synchronous* (httpx.Client, SQLModel Session) -- FastAPI runs
# sync endpoints in a threadpool, which is more than enough for alpha volumes and
# keeps the provisioning state machine trivially readable/testable.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",  # Postgres driver for control-db (prod)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "respx>=0.21",  # httpx mock transport -- ALL external HTTP in tests is mocked
]

[project.scripts]
# Convenience entrypoint; Railway runs `uvicorn control_api.main:app` directly.
squire-control-api = "control_api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/control_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../infra"]
filterwarnings = [
    # SQLModel/SQLAlchemy emit a few deprecation warnings on 3.12; not our problem.
    "ignore::DeprecationWarning",
]
